<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <!-- Header: title + scoreboard -->
    <header class="hud">
      <h1 class="title">Snake</h1>
      <div class="scores">
        <div class="score-box">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="score-box">
          <span class="label">Best</span>
          <span id="best" class="value">0</span>
        </div>
      </div>
    </header>

    <!-- Board: the canvas plus overlays stacked on top of it -->
    <div class="board-wrap">
      <canvas id="board" aria-label="Snake game board"></canvas>

      <!-- Start screen -->
      <div id="start-screen" class="overlay visible">
        <h2>Ready?</h2>
        <p>Use <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move.<br />
           <kbd>Space</kbd> pauses.</p>
        <button id="start-btn" class="btn">Start Game</button>
      </div>

      <!-- Pause screen -->
      <div id="pause-screen" class="overlay">
        <h2>Paused</h2>
        <p>Press <kbd>Space</kbd> to resume</p>
      </div>

      <!-- Game Over screen -->
      <div id="gameover-screen" class="overlay">
        <h2>Game Over</h2>
        <p class="final">Score: <strong id="final-score">0</strong></p>
        <p id="new-best" class="new-best" hidden>🏆 New best!</p>
        <button id="restart-btn" class="btn">Restart</button>
        <p class="hint">or press <kbd>Enter</kbd></p>
      </div>
    </div>

    <footer class="footer">Swipe on touch screens to steer.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>

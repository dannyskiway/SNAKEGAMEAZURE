name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]      # deploy every time you commit to main
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"       # index.html is at the repo root
          api_location: ""        # no backend
          output_location: ""     # no build output folder
          skip_app_build: true    # plain HTML/CSS/JS, nothing to build
